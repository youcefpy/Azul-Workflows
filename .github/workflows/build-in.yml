name: CI workflow

on: 
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.9-slim
    steps:
        - name: Checkout
          uses: actions/checkout@v3
        - name: Install Dependencies
          run: | 
            python -m pip install --upgrade pip 
            pip install -r backend/requirements.txt
        - name: mypy 
          run : |
            mypy backend/backend
        - name: Tests
          run: |
            cd backend
            pytest
