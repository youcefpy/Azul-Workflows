name: CI workflow

on: 
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.10-slim
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@postgres:5432/test_db
    steps:
        - name: Checkout
          uses: actions/checkout@v3
        - name: Install Dependencies
          run: | 
            python -m pip install --upgrade pip 
            pip install -r backend/requirements.txt
        - name: mypy 
          run : |
            mypy backend/backend
        - name: Tests
          run: |
            cd backend
            pytest
